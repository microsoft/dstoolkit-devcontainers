$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
# https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2?tabs=cli
name: pytorch-gpu-env
build:
  path: /workspace  # build context must be repo root since Dockerfile uses root-relative paths (e.g. src/sample_pytorch_gpu_project/.devcontainer/...)
  dockerfile_path: src/sample_pytorch_gpu_project/.devcontainer/Dockerfile
